apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: nginx-server
  name: nginx-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nginx-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: nginx-server
    spec:
      containers:
        - image: nginx-server:local
          imagePullPolicy: IfNotPresent
          name: nginx-server
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-server-cm0
              readOnly: true
              subPath: nginx.conf
            - mountPath: /etc/nginx/certs
              name: nginx-server-cm1
              readOnly: true
            - mountPath: /usr/share/nginx/html/qbwc
              name: nginx-server-cm2
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: nginx_react_django.conf
                path: nginx.conf
            name: nginx-server-cm0
          name: nginx-server-cm0
        - configMap:
            name: nginx-server-cm1
          name: nginx-server-cm1
        - configMap:
            name: nginx-server-cm2
          name: nginx-server-cm2
