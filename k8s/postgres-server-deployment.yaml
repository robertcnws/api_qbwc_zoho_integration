apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: postgres-server
  name: postgres-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: postgres-server
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: api_qbwc_zoho_envqa_db
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
          image: postgres:16.0
          name: postgres-server
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
            - mountPath: /docker-entrypoint-initdb.d
              name: postgres-server-cm1
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - configMap:
            name: postgres-server-cm1
          name: postgres-server-cm1
