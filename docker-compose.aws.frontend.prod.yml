services:
  aws_frontend_app:
    build:
      context: ./api_qbwc_zoho_frontend
      dockerfile: Dockerfile.aws.frontend.prod
    container_name: aws_frontend_app
    environment:
      - NODE_ENV=production
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "3030:3030"
    networks:
      - net_api_qbwc_zoho_network
    restart: unless-stopped

networks:
  net_api_qbwc_zoho_network:
    driver: bridge