services:
  aws_backend-app:
    build:
      context: ./api_qbwc_zoho_backend
      dockerfile: Dockerfile.aws.backend.prod
    container_name: aws_backend-app
    restart: unless-stopped
    volumes:
      - ./api_qbwc_zoho_backend:/app
      - ./api_qbwc_zoho_backend/nginx/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./api_qbwc_zoho_backend/static:/app/staticfiles
    ports:
      - "8000:8000"
    networks:
      - net_api_qbwc_zoho_network

networks:
  net_api_qbwc_zoho_network:
    driver: bridge