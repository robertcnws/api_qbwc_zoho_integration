services:
  backend_app:
    build:
      context: ./api_qbwc_zoho_backend
      dockerfile: Dockerfile
    container_name: backend_app
    volumes:
      - ./api_qbwc_zoho_backend:/app
      - ./api_qbwc_zoho_backend/_gunicorn/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./api_qbwc_zoho_backend/local_backup:/app/backup
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=project_api.settings
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DJANGO_SUPERUSER_PASSWORD=admin
      - LOGINUSER_USERNAME=test
      - LOGINUSER_EMAIL=test@example.com
      - LOGINUSER_PASSWORD=Hialeah2024*-
      - CELERY_BROKER_URL=redis://redis_installation:6379/0
      - CELERY_RESULT_BACKEND=redis://redis_installation:6379/0
    env_file:
      - ./api_qbwc_zoho_backend/.env
    networks:
      - shared-network
    depends_on:
      - redis_installation

  react_app:
    build:
      context: ./api_qbwc_zoho_frontend
      dockerfile: Dockerfile.onpremise
    container_name: react_app
    volumes:
      - ./api_qbwc_zoho_frontend/build:/app/build 
    env_file:
      - ./api_qbwc_zoho_frontend/.env
    networks:
      - shared-network

  postgres_server:
    image: postgres:16.0
    container_name: postgres_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api_qbwc_zoho_backend/scripts_db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=api_qbwc_zoho_envqa_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    networks:
      - shared-network

  nginx_server:
    build:
      context: ./nginx_onpremise
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_onpremise/nginx_react_django.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_onpremise/certs:/etc/nginx/certs:ro
      - ./api_qbwc_zoho_frontend/build:/usr/share/nginx/html/qbwc 
    depends_on:
      - backend_app
      - react_app
    networks:
      - shared-network

  redis_installation:
    image: redis:latest
    container_name: redis_installation
    volumes:
      - redis_data:/data
    networks:
      - shared-network

volumes:
  postgres_data:
  redis_data:

networks:
  shared-network:
    external: true
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: "10.1.10.0/24"